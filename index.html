<!DOCTYPE html>
<html>
<head>
  <title>Random Compliment Generator</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; text-align: center; }
    button { font-size: 1.2rem; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>Random Compliment Generator</h1>
  <button onclick="compliment()">Give me a compliment</button>
  <div id="output" style="margin-top: 20px; font-size: 1.3rem;"></div>

  <script>
    function compliment() {
      document.getElementById('output').innerText = "Nothing here yet — build me!";
      // Build me! Add an array of compliments and pick one at random.
    }
  </script>
</body>
</html>
